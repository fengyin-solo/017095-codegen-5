<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%23111' width='32' height='32' rx='4'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='%23fff' font-family='system-ui'>知</text></svg>" />
  <title>知识配置平台 - 中后台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script>
  (function () {
    try {
      var savedTheme = localStorage.getItem('knowledge_platform_theme');
      var theme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : 'light';
      if (theme === 'dark') document.documentElement.classList.add('dark');
      document.documentElement.style.colorScheme = theme;
    } catch (_) {}
  })();
</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/tailwind-config.js"></script>
  <script src="js/theme.js"></script>
  <link href="css/common.css" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-canvas text-slate-600 font-sans antialiased min-h-screen">
  <div id="app" class="flex min-h-screen">
    <aside class="app-sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon flex items-center justify-center">
          <span class="iconify" data-icon="lucide:book-open" data-width="20" data-height="20"></span>
        </div>
        <span class="sidebar-logo-text">知识配置平台</span>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item router-active"><span class="iconify nav-item-icon" data-icon="lucide:layout-dashboard" data-width="18" data-height="18"></span>概览</a>
        <a href="merchant.html" class="nav-item"><span class="iconify nav-item-icon" data-icon="lucide:store" data-width="18" data-height="18"></span>商家知识</a>
        <a href="merchant-set.html" class="nav-item"><span class="iconify nav-item-icon" data-icon="lucide:layers" data-width="18" data-height="18"></span>商家集合知识</a>
        <a href="industry.html" class="nav-item"><span class="iconify nav-item-icon" data-icon="lucide:briefcase" data-width="18" data-height="18"></span>行业知识</a>
        <a href="global.html" class="nav-item"><span class="iconify nav-item-icon" data-icon="lucide:globe" data-width="18" data-height="18"></span>通用知识</a>
      </nav>
    </aside>
    <main class="flex-1 flex flex-col min-w-0">
      <header class="app-header border-b border-slate-200">
        <span class="app-header-title text-slate-700 font-medium">知识配置平台</span>
      </header>
      <div class="flex-1 p-6 md:p-8 space-y-8">
        <div>
          <h2 class="section-title tracking-tight text-slate-900 mb-2">概览</h2>
          <p class="section-desc text-sm text-slate-500">从左侧导航进入：商家知识、商家集合知识、行业知识、通用知识。</p>
        </div>
        <section class="premium-card rounded-xl border border-slate-100 shadow-sm overflow-hidden" id="overviewStatsWrap">
          <div class="grid grid-cols-2 lg:grid-cols-4 divide-x divide-slate-100" id="overviewStats">
            <!-- 由脚本填充 -->
          </div>
        </section>

        <!-- 图表：不同类型知识数量 & 占比 -->
        <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div class="premium-card rounded-xl border border-slate-100 shadow-sm p-6">
            <h3 class="text-base font-semibold text-slate-900 mb-4">各类型知识数量</h3>
            <div class="h-64 md:h-72">
              <canvas id="chartBar"></canvas>
            </div>
          </div>
          <div class="premium-card rounded-xl border border-slate-100 shadow-sm p-6">
            <h3 class="text-base font-semibold text-slate-900 mb-4">知识类型占比</h3>
            <div class="h-64 md:h-72">
              <canvas id="chartPie"></canvas>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="js/mock.js"></script>
  <script src="js/common.js"></script>
  <script>
(function () {
  var container = document.getElementById('overviewStats');
  if (!container) return;

  var P = 'knowledge_platform_';
  function load(key, fallback) {
    try {
      var s = localStorage.getItem(P + key);
      return s != null ? JSON.parse(s) : fallback;
    } catch (_) { return fallback; }
  }

  function getOverviewStats() {
    if (typeof MockStore !== 'undefined' && typeof MockStore.getOverviewStats === 'function') {
      return MockStore.getOverviewStats();
    }
    var merchants = load('merchants', [{ id: 'M001' }, { id: 'M002' }, { id: 'M003' }]);
    var sets = load('merchantSets', []);
    var industries = load('industries', [{ id: 'IND01' }, { id: 'IND02' }, { id: 'IND03' }]);
    var merchantKnowledge = load('merchantKnowledge', {});
    var merchantSetKnowledge = load('merchantSetKnowledge', {});
    var industryKnowledge = load('industryKnowledge', {});
    var globalKnowledge = load('globalKnowledge', []);

    var merchantKnowledgeCount = 0;
    merchants.forEach(function (m) { merchantKnowledgeCount += (merchantKnowledge[m.id] || []).length; });
    var merchantSetKnowledgeCount = 0;
    sets.forEach(function (s) { merchantSetKnowledgeCount += (merchantSetKnowledge[s.id] || []).length; });
    var industryKnowledgeCount = 0;
    industries.forEach(function (i) { industryKnowledgeCount += (industryKnowledge[i.id] || []).length; });
    var globalCount = (globalKnowledge || []).length;

    return {
      merchantCount: merchants.length,
      merchantKnowledgeCount: merchantKnowledgeCount,
      merchantSetCount: sets.length,
      merchantSetKnowledgeCount: merchantSetKnowledgeCount,
      industryCount: industries.length,
      industryKnowledgeCount: industryKnowledgeCount,
      globalKnowledgeCount: globalCount,
      totalKnowledgeCount: merchantKnowledgeCount + merchantSetKnowledgeCount + industryKnowledgeCount + globalCount,
    };
  }

  var s = getOverviewStats();
  var items = [
    { label: '总知识数量', value: s.totalKnowledgeCount, unit: '条', icon: 'lucide:book-open' },
    { label: '商家', value: s.merchantCount, unit: '家', icon: 'lucide:store' },
    { label: '商家集合', value: s.merchantSetCount, unit: '个', icon: 'lucide:layers' },
    { label: '行业数量', value: s.industryCount, unit: '个', icon: 'lucide:briefcase' },
  ];
  container.innerHTML = items.map(function (item) {
    return '<div class="flex flex-col items-center justify-center py-6 px-4 text-center min-w-0">' +
      '<span class="iconify mb-2 text-slate-400" data-icon="' + item.icon + '" data-width="22" data-height="22"></span>' +
      '<div class="text-xs font-medium uppercase tracking-wider text-slate-500 mb-1">' + item.label + '</div>' +
      '<div class="flex items-baseline justify-center gap-1">' +
        '<span class="text-2xl md:text-3xl font-semibold text-slate-900 tabular-nums">' + Number(item.value) + '</span>' +
        '<span class="text-sm text-slate-500">' + item.unit + '</span>' +
      '</div>' +
    '</div>';
  }).join('');

  // 图表配色来自设计规范，随浅色/深色风格切换
  var chartLabels = ['商家知识', '商家集合知识', '行业知识', '通用知识'];
  var chartCounts = [
    s.merchantKnowledgeCount,
    s.merchantSetKnowledgeCount,
    s.industryKnowledgeCount,
    s.globalKnowledgeCount
  ];
  function themeVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  var charts = [];

  function getChartPalette() {
    return {
      fills: [
        themeVar('--chart-1'),
        themeVar('--chart-2'),
        themeVar('--chart-3'),
        themeVar('--chart-4')
      ],
      strokes: [
        themeVar('--chart-stroke-1'),
        themeVar('--chart-stroke-2'),
        themeVar('--chart-stroke-3'),
        themeVar('--chart-stroke-4')
      ],
      border: themeVar('--chart-border'),
      grid: themeVar('--chart-grid'),
      axis: themeVar('--chart-axis'),
      axisStrong: themeVar('--chart-axis-strong'),
      tooltip: themeVar('--chart-tooltip'),
      chartRadius: parseInt(themeVar('--radius-chart-bar'), 10) || 0
    };
  }

  function applyChartTheme() {
    var palette = getChartPalette();
    charts.forEach(function (chart) {
      if (chart.options.scales && chart.options.scales.y) {
        chart.data.datasets[0].backgroundColor = palette.fills;
        chart.data.datasets[0].borderColor = chart.options.scales && chart.options.scales.y ? palette.strokes : palette.border;
        chart.options.scales.y.title.color = palette.axis;
        chart.options.scales.y.ticks.color = palette.axis;
        chart.options.scales.y.grid.color = palette.grid;
        chart.options.scales.x.ticks.color = palette.axis;
      } else {
        chart.data.datasets[0].backgroundColor = palette.fills;
        chart.data.datasets[0].borderColor = palette.border;
        chart.options.plugins.legend.labels.color = palette.axisStrong;
        chart.options.plugins.tooltip.backgroundColor = palette.tooltip;
      }
      chart.update('none');
    });
  }

  if (typeof Chart !== 'undefined') {
    var palette = getChartPalette();
    // 柱状图：从 0 开始保证柱子可见，Y 轴整数
    var barCtx = document.getElementById('chartBar');
    if (barCtx) {
      charts.push(new Chart(barCtx, {
        type: 'bar',
        data: {
          labels: chartLabels,
          datasets: [{
            label: '知识数量（条）',
            data: chartCounts,
            backgroundColor: palette.fills,
            borderColor: palette.strokes,
            borderWidth: 1,
            borderRadius: palette.chartRadius,
            borderSkipped: false,
            barPercentage: 0.6,
            categoryPercentage: 0.65,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: {
              beginAtZero: true,
              title: {
                display: true,
                text: '数值',
                font: { size: 12 },
                color: palette.axis
              },
              ticks: {
                font: { size: 12 },
                color: palette.axis,
                stepSize: 1,
                callback: function (v) { return Number.isInteger(v) ? v : ''; }
              },
              grid: { color: palette.grid }
            },
            x: {
              ticks: { font: { size: 11 }, color: palette.axis, maxRotation: 25 },
              grid: { display: false }
            }
          }
        }
      }));
    }

    // 饼图：与柱状图同色系
    var pieCtx = document.getElementById('chartPie');
    if (pieCtx) {
      charts.push(new Chart(pieCtx, {
        type: 'pie',
        data: {
          labels: chartLabels,
          datasets: [{
            data: chartCounts,
            backgroundColor: palette.fills,
            borderColor: palette.border,
            borderWidth: 3,
            hoverOffset: 8,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'right',
              labels: { font: { size: 12 }, color: palette.axisStrong, padding: 14, usePointStyle: true }
            },
            tooltip: {
              backgroundColor: palette.tooltip,
              padding: 12,
              titleFont: { size: 13 },
              bodyFont: { size: 12 },
              callbacks: {
                label: function (ctx) {
                  var total = ctx.dataset.data.reduce(function (a, b) { return a + b; }, 0);
                  var pct = total ? ((ctx.raw / total) * 100).toFixed(1) : 0;
                  return ctx.label + '：' + ctx.raw + ' 条（' + pct + '%）';
                }
              }
            }
          }
        }
      }));
    }

    document.addEventListener('themechange', applyChartTheme);
  }
})();
  </script>
</body>
</html>
